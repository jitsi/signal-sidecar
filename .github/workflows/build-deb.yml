name: Build deb

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, for example v0.4.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-deb
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      # a merge releases only when package.json has a version that has no tag yet
      - id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          RELEASE=true
          if [ -n "$INPUT_TAG" ]; then
            if [ "$INPUT_TAG" != "$TAG" ]; then
              echo "::error::tag $INPUT_TAG does not match package.json version $VERSION"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists. Bump the version in package.json to release a new deb."
            RELEASE=false
          fi
          {
            echo "release=$RELEASE"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build-deb:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper devscripts fakeroot

      # the epoch keeps semver releases above the old CI's integer versions (up to 75-1)
      - name: Set the package version
        env:
          DEBEMAIL: dev@jitsi.org
          DEBFULLNAME: Jitsi Team
        run: |
          dch --newversion "1:${VERSION}-1" --distribution unstable --force-distribution \
            "Build from git: $(git rev-parse --short HEAD)"

      # -d skips the Build-Depends check: npm comes from setup-node, not from apt.
      # mini-dinstall in the ops repo needs the .changes and .buildinfo next to the .deb
      - name: Build the package
        run: |
          dpkg-buildpackage -A -us -uc -d
          mkdir -p out
          mv ../signal-sidecar_"${VERSION}"-1_*.deb ../signal-sidecar_"${VERSION}"-1_*.changes ../signal-sidecar_"${VERSION}"-1_*.buildinfo out/
          (cd out && sha256sum -- * > SHA256SUMS)

      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.deb
            out/*.changes
            out/*.buildinfo

      # the release and its tag are created only after a good build, so a failed build
      # leaves no tag and the next merge tries the same version again.
      # the bundle lets jenkins run gh attestation verify --bundle without a GitHub token.
      # no --clobber: a version that is already published must never be replaced
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" out/attestation.sigstore.json
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/*
